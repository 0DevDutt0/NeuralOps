services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neuralops
      POSTGRES_PASSWORD: neuralops
      POSTGRES_DB: neuralops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralops -d neuralops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── NeuralOps API ─────────────────────────────────────────────────────────
  neuralops-api:
    image: neuralops-local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        INSTALL_GUARDRAILS: ${INSTALL_GUARDRAILS:-0}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://neuralops:neuralops@postgres:5432/neuralops
      - NEURALOPS_ENVIRONMENT=production
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - JUDGE_MODEL=${JUDGE_MODEL:-llama-3.3-70b-versatile}
      - JUDGE_BACKEND=${JUDGE_BACKEND:-groq}
      - DRIFT_ALERT_THRESHOLD=${DRIFT_ALERT_THRESHOLD:-6.5}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TOXICITY_DEVICE=cpu
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && exec python main.py"

  # ── Streamlit Dashboard ────────────────────────────────────────────────────
  neuralops-dashboard:
    image: neuralops-local
    pull_policy: never
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - DASHBOARD_API_URL=http://neuralops-api:8000
    depends_on:
      neuralops-api:
        condition: service_healthy
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).close()"]
      interval: 10s
      timeout: 8s
      retries: 5
    restart: unless-stopped

  # ── pgAdmin (dev only — use: docker-compose --profile dev up) ─────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@neuralops.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
