name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check neuralops/ tests/ dashboard/ main.py

      - name: Run mypy type checker
        run: mypy neuralops/ --ignore-missing-imports

      - name: Run pytest with coverage
        env:
          NEURALOPS_ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          GROQ_API_KEY: test_key
          MISTRAL_API_KEY: test_key
        run: |
          pytest tests/ -v --cov=neuralops --cov-report=xml --cov-report=term-missing

      - name: Run the key-free benchmark
        if: matrix.python-version == '3.11'
        run: python -m neuralops.demo --benchmark

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build --wait --wait-timeout 180

      - name: Verify database-backed API and dashboard
        run: |
          curl --fail --silent --show-error http://localhost:8000/health/ready
          curl --fail --silent --show-error http://localhost:8000/api/v1/experiments/usage
          curl --fail --silent --show-error http://localhost:8501/_stcore/health
          curl --fail --silent --show-error -X POST http://localhost:8000/api/v1/prompts/ \
            -H 'Content-Type: application/json' -d '{"name":"compose-smoke"}'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
